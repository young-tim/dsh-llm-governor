# dsh-llm-governor bundle patch：将 Governor 治理层安装为 profile 的一个
# patch layer。应用顺序为 dsh-base →（可选 web-app / headless）→ 本文件 →
# 用户自己的 profile cordis.patch.yml。
#
# 两个动作：
# 1. insert：插入 Governor host 插件行。该插件注册 ctx.governor 服务，监听
#    agent/pre-step（自动分类）、agent/request（准入与路由）、llm/stream（Usage
#    观察）与 agent/request-error（Fallback 恢复），并将决策、Usage、身份绑定与
#    策略写入 $DSH_HOME/dsh-llm-governor/governor.db（SQLite WAL）。
# 2. disable：禁用基础 llm-retry 行，使 Governor 成为唯一的 Recovery Owner。
#    官方 dsh-llm-retry 与 Governor 同时持有 agent/request-error 恢复权时，同一
#    失败可能被重复重试，Credits 不可预测，因此 bundle 层面二选一（见
#    docs/TECHNICAL_DESIGN.md §4.1）。卸载本 bundle 后（dsh plugin remove
#    dsh-llm-governor），dsh 重新启用基础 llm-retry，恢复默认行为。
#
# 身份默认 local 模式（DSH 进程所有者即治理用户）；多用户部署应改为 header/jwt：
#
#   identity:
#     provider: header
#     header_name: X-Governor-User
#     trusted_proxy: my-ingress          # 强制声明信任边界
#     proxy_header_name: X-Proxy-Id      # 可选：校验代理标识
#   identity:
#     provider: jwt
#     jwt_issuer: https://sso.example.com
#     jwt_audience: governor
#     jwt_algorithms: [RS256]
#     jwt_key_file: /etc/governor/pub.pem
#
# header/jwt 模式下 session 必须在入站边界绑定（POST /governor/api/bind，
# 仅本地回环可信，由反向代理/companion ingress 调用），无绑定时 fail closed。
# UI 默认挂载到 DSH webServer 的 /governor 前缀路由（Models/Users/Usage 三页）。
# Auto 路由的 LLM 分类器默认关闭（auto.llm_classifier），启用后经 ctx.llm
# 调用配置的轻量模型分类（temperature=0，严格 JSON，失败降级 Quality First）。

- insert:
    - id: dsh-llm-governor
      name: 'dsh-llm-governor'
      config:
        # 配置由严格 Schema 验证（未知字段拒绝/范围校验/条件必填），非法配置拒绝加载
        schema_version: 1
        identity:
          provider: local
          local_user_id: local
        routing:
          default: manual
        fallback:
          enabled: true
          max_attempts: 2
        storage:
          enabled: true
        ui:
          enabled: true

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'
  disabled: true
